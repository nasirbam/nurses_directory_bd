name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Test Nurses BD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NursesBD-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NursesBD-debug-apk
          path: app/build/outputs/apk/debug/NursesBD-debug.apk
          retention-days: 30

      - name: Publish GitHub Release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Nurses BD Latest APK
          body: |
            Automated Android APK build for **Nurses BD** (Bangladesh Nurses E-Directory).

            - Download **NursesBD-debug.apk** below and install it on your Android device.
            - Backed by live Cloud Firestore & Google Sign-In.
          draft: false
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/NursesBD-debug.apk
