name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Nurses BD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore, Firebase config, and SDK licenses
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found; building without bundled Firebase client config unless GOOGLE_SERVICES_JSON secret is set."
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDK_MGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDK_MGR" ]; then
              yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NursesBD-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NursesBD-debug-apk
          path: app/build/outputs/apk/debug/NursesBD-debug.apk
          retention-days: 30

  release:
    name: Publish GitHub Release & Deployment
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: android-release
      url: https://github.com/${{ github.repository }}/releases/tag/latest-apk

    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: NursesBD-debug-apk
          path: release-apk

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Nurses BD Latest APK
          body: |
            Automated Android APK build for **Nurses BD** (Bangladesh Nurses E-Directory).

            - Download **NursesBD-debug.apk** below and install it on your Android device.
            - Backed by live Cloud Firestore & Google Sign-In.
          draft: false
          prerelease: false
          files: release-apk/NursesBD-debug.apk
